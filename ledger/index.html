<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="我的帳本" />
<title>我的帳本</title>
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --text:#16181d; --muted:#6b7280; --line:#e5e7eb;
  --accent:#4f46e5; --accent-soft:#eef0ff; --exp:#dc2626; --inc:#059669; --shadow:0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#1a1d24; --text:#eceef2; --muted:#9aa1ad; --line:#2a2e38;
  --accent:#818cf8; --accent-soft:#23264a; --exp:#f87171; --inc:#34d399; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#0f1115; --card:#1a1d24; --text:#eceef2; --muted:#9aa1ad; --line:#2a2e38;
    --accent:#818cf8; --accent-soft:#23264a; --exp:#f87171; --inc:#34d399; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.exp{color:var(--exp)} .inc{color:var(--inc)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month b{font-size:18px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--exp)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.item:first-child,.dayhead + .item{border-top:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--accent-soft)}
.t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line)}
.dayhead:first-child{border-top:0;padding-top:0}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.donutwrap{display:flex;gap:16px;align-items:center}
.donut{width:132px;height:132px;flex:none}
.legend{flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px}
.bars span{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bars span.z{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.trend{display:flex;align-items:flex-end;gap:10px;height:110px}
.trend .g{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.trend .p{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.trend .p i{width:38%;max-width:16px;border-radius:3px 3px 0 0;min-height:1px}
.trend small{font-size:11px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 12px;padding-bottom:2px}
.chip{padding:6px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap;font-size:13.5px}
.chip.on{background:var(--accent);color:#fff}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.inp:focus{border-color:var(--accent)}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.amt{font-size:30px;font-weight:700;text-align:right;padding:10px 12px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.cat{padding:8px 2px;border-radius:12px;text-align:center;font-size:12px;border:1.5px solid transparent;overflow:hidden}
.cat em{display:block;font-style:normal;font-size:22px;line-height:1.3}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;text-align:center}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.danger{background:none;color:var(--exp)}
.btns{display:flex;gap:10px;margin-top:6px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;font-size:18px;display:grid;place-items:center}
.sw button.on{border-color:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav > div{max-width:520px;margin:0 auto;display:flex;align-items:center}
nav button{flex:1;padding:8px 0 7px;font-size:11px;color:var(--muted)}
nav button em{display:block;font-style:normal;font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--accent);font-weight:700}
nav button.on em{filter:none;opacity:1}
nav .add{flex:none;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;margin:-18px 8px 0;box-shadow:0 6px 16px rgba(79,70,229,.4);padding:0}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
#mask.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 14px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
#toast.show{opacity:.95}
.set{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
@media (min-width:560px){ #mask{align-items:center} #sheet{border-radius:20px} }
</style>
</head>
<body>
<div id="app"></div>
<nav><div>
  <button data-act="tab" data-v="home"><em>🏠</em>總覽</button>
  <button data-act="tab" data-v="list"><em>📒</em>帳本</button>
  <button class="add" data-act="newRec" aria-label="新增紀錄">＋</button>
  <button data-act="tab" data-v="acc"><em>💳</em>帳戶</button>
  <button data-act="tab" data-v="set"><em>⚙️</em>設定</button>
</div></nav>
<div id="mask"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ========== 基本工具 ========== */
const KEY = 'ledger.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const fmt = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n * 100) / 100).toLocaleString('zh-TW', {maximumFractionDigits: 2});
const addMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = m => `${m.slice(0, 4)} 年 ${Number(m.slice(5))} 月`;
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const dayLabel = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}月${d.getDate()}日 週${WEEK[d.getDay()]}`; };
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899','#78716c','#64748b'];
const ICONS = ['🍜','☕','🚇','🚗','🛍️','🧻','🎮','🏠','💊','📚','💻','📱','✈️','🐶','👕','🎁','💡','📦','💰','📈','🏦','🧧','➕'];
const ACC_TYPES = {cash:['現金','💵'], bank:['銀行','🏦'], card:['信用卡','💳'], epay:['電子支付','📱'], stock:['證券','📈'], other:['其他','📦']};

/* ========== 資料 ========== */
function defaults() {
  const c = (name, icon, color, kind) => ({id: uid(), name, icon, color, kind});
  return {
    v: 1, theme: 'auto',
    accounts: [
      {id: uid(), name: '現金', type: 'cash', init: 0},
      {id: uid(), name: '銀行帳戶', type: 'bank', init: 0},
      {id: uid(), name: '信用卡', type: 'card', init: 0},
    ],
    categories: [
      c('餐飲','🍜','#f97316','exp'), c('交通','🚇','#3b82f6','exp'), c('購物','🛍️','#ec4899','exp'),
      c('日用','🧻','#14b8a6','exp'), c('娛樂','🎮','#a855f7','exp'), c('居家','🏠','#eab308','exp'),
      c('醫療','💊','#ef4444','exp'), c('學習','📚','#22c55e','exp'), c('3C','💻','#6366f1','exp'),
      c('其他','📦','#64748b','exp'),
      c('薪資','💰','#22c55e','inc'), c('獎金','🎁','#f97316','inc'), c('投資','📈','#3b82f6','inc'),
      c('利息','🏦','#14b8a6','inc'), c('其他收入','➕','#64748b','inc'),
    ],
    records: [], budget: {total: 0, cats: {}},
    inbox: [], auto: {url: '', key: '', last: 1},
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.records)) return norm(s); } catch (e) {}
  return defaults();
}
function norm(s) { // 補上舊版資料沒有的欄位
  s.budget = s.budget || {total: 0, cats: {}}; s.budget.cats = s.budget.cats || {};
  s.inbox = Array.isArray(s.inbox) ? s.inbox : [];
  s.auto = Object.assign({url: '', key: '', last: 1}, s.auto || {});
  return s;
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('儲存失敗：瀏覽器不允許寫入'); }
}
const cat = id => S.categories.find(c => c.id === id) || {name: '未分類', icon: '❔', color: '#9ca3af'};
const acc = id => S.accounts.find(a => a.id === id) || {name: '未指定帳戶', type: 'other'};
function balance(a) {
  let b = Number(a.init) || 0;
  for (const r of S.records) {
    if (r.type === 'inc' && r.acc === a.id) b += r.amount;
    else if (r.type === 'exp' && r.acc === a.id) b -= r.amount;
    else if (r.type === 'xfer') { if (r.acc === a.id) b -= r.amount; if (r.toAcc === a.id) b += r.amount; }
  }
  return b;
}
const sum = (rs, t) => rs.reduce((s, r) => s + (r.type === t ? r.amount : 0), 0);
const inMonth = m => S.records.filter(r => r.date.startsWith(m));

/* ========== 畫面狀態 ========== */
const ui = {tab: 'home', month: today().slice(0, 7), q: '', ftype: 'all', allTime: false};
let D = null; // 編輯中的草稿

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}
function applyTheme() { document.documentElement.dataset.theme = S.theme || 'auto'; }
function openSheet(html) { $('#sheet').innerHTML = html; $('#mask').classList.add('show'); $('#sheet').scrollTop = 0; }
function closeSheet() { $('#mask').classList.remove('show'); D = null; }

/* ========== 共用片段 ========== */
function tint(color) { return `background:color-mix(in srgb, ${color} 18%, transparent)`; }
function recItem(r) {
  let ico, t1, t2, amt;
  if (r.type === 'xfer') {
    ico = `<div class="ico">🔁</div>`; t1 = r.note || '轉帳';
    t2 = `${esc(acc(r.acc).name)} → ${esc(acc(r.toAcc).name)}`; amt = `<b class="num">${fmt(r.amount)}</b>`;
  } else {
    const c = cat(r.cat);
    ico = `<div class="ico" style="${tint(c.color)}">${esc(c.icon)}</div>`;
    t1 = r.merchant || c.name;
    t2 = [c.name, acc(r.acc).name, r.note].filter(Boolean).map(esc).join(' · ');
    amt = r.type === 'exp' ? `<b class="num exp">-${fmt(r.amount)}</b>` : `<b class="num inc">+${fmt(r.amount)}</b>`;
    t1 = esc(t1);
  }
  return `<button class="item" data-act="editRec" data-v="${r.id}">${ico}<div class="sp"><div class="t1">${r.type === 'xfer' ? esc(t1) : t1}</div><div class="t2">${t2}</div></div>${amt}</button>`;
}
function monthBar() {
  return `<div class="month"><button class="ib" data-act="month" data-v="-1" aria-label="上個月">‹</button>
    <button data-act="month" data-v="0"><b>${monthLabel(ui.month)}</b></button>
    <button class="ib" data-act="month" data-v="1" aria-label="下個月">›</button></div>`;
}
function sortRecs(rs) { return rs.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0)); }

/* ========== 總覽 ========== */
function viewHome() {
  const rs = inMonth(ui.month), exp = sum(rs, 'exp'), inc = sum(rs, 'inc');
  const prev = sum(inMonth(addMonth(ui.month, -1)), 'exp');
  let cmp = '上個月沒有支出紀錄';
  if (prev > 0) { const d = (exp - prev) / prev * 100; cmp = `比上個月 ${d >= 0 ? '多' : '少'} ${Math.abs(d).toFixed(0)}%（上月 ${fmt(prev)}）`; }

  // 預算
  let budget = '';
  const bt = Number(S.budget.total) || 0;
  if (bt > 0) {
    const left = bt - exp, pct = Math.min(100, exp / bt * 100);
    budget = `<div class="card"><div class="row"><h2 class="sp" style="margin:0">本月預算</h2><span class="small muted">總預算 ${fmt(bt)}</span></div>
      <div class="row" style="margin-top:6px"><b class="sp ${left < 0 ? 'exp' : ''}" style="font-size:20px">${left < 0 ? '超支 ' + fmt(-left) : '剩餘 ' + fmt(left)}</b><span class="small muted">已花 ${pct.toFixed(0)}%</span></div>
      <div class="bar"><i class="${left < 0 ? 'over' : ''}" style="width:${pct}%"></i></div></div>`;
  }

  // 分類甜甜圈
  const by = {};
  rs.forEach(r => { if (r.type === 'exp') by[r.cat] = (by[r.cat] || 0) + r.amount; });
  const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
  let donut = `<div class="empty">這個月沒有支出紀錄</div>`;
  if (cats.length) {
    let off = 25, segs = '';
    cats.forEach(([id, v]) => {
      const p = v / exp * 100;
      segs += `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${cat(id).color}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"></circle>`;
      off -= p;
    });
    const lg = cats.map(([id, v]) => {
      const c = cat(id), lim = Number(S.budget.cats[id]) || 0;
      const b = lim ? `<div class="bar" style="height:4px;margin:0 0 4px 18px"><i class="${v > lim ? 'over' : ''}" style="width:${Math.min(100, v / lim * 100)}%;background:${v > lim ? '' : c.color}"></i></div>` : '';
      return `<div class="lg"><i class="dot" style="background:${c.color}"></i><span class="sp t1" style="font-weight:500">${esc(c.icon)} ${esc(c.name)}</span><span class="muted small">${(v / exp * 100).toFixed(0)}%</span><b class="num">${fmt(v)}</b></div>${b}`;
    }).join('');
    donut = `<div class="donutwrap"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="支出分類比例">${segs}
      <text x="21" y="20" text-anchor="middle" font-size="3.2" fill="currentColor" opacity=".6">支出</text>
      <text x="21" y="25" text-anchor="middle" font-size="4.2" font-weight="700" fill="currentColor">${cats.length} 類</text></svg>
      <div class="legend">${lg}</div></div>`;
  }

  // 每日支出
  const [y, mo] = ui.month.split('-').map(Number), days = new Date(y, mo, 0).getDate();
  const daily = Array(days).fill(0);
  rs.forEach(r => { if (r.type === 'exp') daily[Number(r.date.slice(8)) - 1] += r.amount; });
  const dmax = Math.max(...daily, 1);
  const isCur = ui.month === today().slice(0, 7);
  const passed = isCur ? new Date().getDate() : days;
  const bars = daily.map((v, i) => `<span class="${v ? '' : 'z'}" style="height:${v ? Math.max(3, v / dmax * 100) : 1}%" title="${mo}/${i + 1}：${fmt(v)}"></span>`).join('');

  // 近 6 個月
  const ms = []; for (let i = 5; i >= 0; i--) ms.push(addMonth(ui.month, -i));
  const tr = ms.map(m => { const x = inMonth(m); return {m, e: sum(x, 'exp'), i: sum(x, 'inc')}; });
  const tmax = Math.max(...tr.map(t => Math.max(t.e, t.i)), 1);
  const trend = tr.map(t => `<div class="g"><div class="p"><i style="height:${t.e / tmax * 100}%;background:var(--exp)" title="支出 ${fmt(t.e)}"></i><i style="height:${t.i / tmax * 100}%;background:var(--inc)" title="收入 ${fmt(t.i)}"></i></div><small>${Number(t.m.slice(5))}月</small></div>`).join('');

  // 商家排行
  const mer = {};
  rs.forEach(r => { if (r.type === 'exp' && r.merchant) mer[r.merchant] = (mer[r.merchant] || 0) + r.amount; });
  const top = Object.entries(mer).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const merHtml = top.length ? `<div class="card"><h2>商家排行</h2>${top.map(([n, v], i) => `<div class="row" style="padding:5px 0"><span class="muted small" style="width:18px">${i + 1}</span><span class="sp t1" style="font-weight:500">${esc(n)}</span><b class="num">${fmt(v)}</b></div>`).join('')}</div>` : '';

  const recent = sortRecs(rs).slice(0, 5);
  const inboxBar = S.inbox.length ? `<button class="card row" style="width:100%;text-align:left;background:var(--accent-soft)" data-act="inbox"><span style="font-size:20px">📥</span><b class="sp">${S.inbox.length} 則通知待確認</b><span class="muted">›</span></button>` : '';
  return `${monthBar()}${inboxBar}
    <div class="card"><div class="muted small">本月支出</div><div class="big num">${fmt(exp)}</div><div class="muted small">${cmp}</div>
      <div class="grid2"><div class="stat"><span class="muted small">收入</span><b class="num inc">${fmt(inc)}</b></div>
      <div class="stat"><span class="muted small">結餘</span><b class="num ${inc - exp < 0 ? 'exp' : ''}">${fmt(inc - exp)}</b></div></div></div>
    ${budget}
    <div class="card"><h2>支出分類</h2>${donut}</div>

/* ========== 通知自動記帳 ========== */
// 把一則通知（app / title / text / ts）解析成 {amount, date, merchant, last4, source}
function parseNotif(n) {
  const app = String(n.app || '').normalize('NFKC');
  const t = (String(n.title || '') + '\n' + String(n.text || '')).normalize('NFKC').replace(/[ \t]+/g, ' ');
  const num = x => Number(String(x).replace(/,/g, ''));
  const ts = new Date(n.ts);
  const p = {amount: 0, date: isNaN(ts) ? today() : ymd(ts), merchant: '', last4: '', source: app || '通知'};
  const date = (y, m, d) => { p.date = `${Number(y) < 1911 ? Number(y) + 1911 : y}-${pad(m)}-${pad(d)}`; };
  let m;
  if ((m = t.match(/末四碼\s*(\d{4})/))) p.last4 = m[1];
  if (/商店名稱|授權時間/.test(t)) {                       // 玉山
    p.source = '玉山';
    if ((m = t.match(/消費金額\s*:\s*([\d,]+(?:\.\d+)?)/) || t.match(/消費\s*([\d,]+)\s*元/))) p.amount = num(m[1]);
    if ((m = t.match(/授權時間\s*:\s*(\d{2,4})\/(\d{1,2})\/(\d{1,2})/))) date(m[1], m[2], m[3]);
    if ((m = t.match(/商店名稱\s*:\s*([^\n]+)/))) p.merchant = m[1].trim();
  } else if (/刷卡/.test(t) && /金額\s*NT\$/.test(t)) {     // 國泰世華
    p.source = '國泰世華';
    if ((m = t.match(/金額\s*NT\$\s*([\d,]+(?:\.\d+)?)/))) p.amount = num(m[1]);
    if ((m = t.match(/於\s*(\d{4})\/(\d{1,2})\/(\d{1,2})/))) date(m[1], m[2], m[3]);
    if ((m = t.match(/在\s*([^\n]+?)\s*刷卡/))) p.merchant = m[1].trim();
  } else if (/LINE\s*Pay/i.test(app + ' ' + t) || (/付款/.test(t) && /NT\$/.test(t))) { // LINE Pay
    p.source = 'LINE Pay';
    if ((m = t.match(/NT\$\s*([\d,]+(?:\.\d+)?)/))) p.amount = num(m[1]);
    if ((m = t.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/))) date(m[1], m[2], m[3]);
  } else if ((m = t.match(/(?:NT\$|NTD|金額|消費)\D{0,6}?([\d,]+(?:\.\d+)?)/))) {       // 其他：盡量抓金額
    p.amount = num(m[1]);
  }
  if (!(p.amount > 0)) p.amount = 0;
  return p;
}
function guessAcc(p) {
  const A = S.accounts;
  return (p.last4 && A.find(a => a.last4 === p.last4))
    || (p.source === 'LINE Pay' && A.find(a => /line/i.test(a.name)))
    || A.find(a => a.name.includes(p.source.slice(0, 2)))
    || A.find(a => a.type === (p.source === 'LINE Pay' ? 'epay' : 'card')) || A[0] || null;
}
const CAT_HINTS = [
  [/youtube|netflix|spotify|disney|steam|kkbox|電影/i, '娛樂'], [/蝦皮|樂購|momo|pchome|yahoo|amazon|uniqlo/i, '購物'],
  [/uber ?eats|foodpanda|麥當勞|星巴克|7-?eleven|統一超商|全家|萊爾富|餐|咖啡/i, '餐飲'],
  [/高鐵|台鐵|捷運|uber|加油|中油|停車|悠遊/i, '交通'], [/全聯|家樂福|好市多|costco|大潤發|屈臣氏|康是美/i, '日用'],
  [/apple|google \*(?!youtube)|microsoft|燦坤/i, '3C'], [/診所|醫院|藥局/i, '醫療'],
];
function guessCat(merchant) {
  const ex = S.categories.filter(c => c.kind === 'exp');
  if (merchant) {
    const prev = sortRecs(S.records).find(r => r.type === 'exp' && r.merchant === merchant && ex.some(c => c.id === r.cat));
    if (prev) return prev.cat;
    for (const [re, name] of CAT_HINTS) if (re.test(merchant)) { const c = ex.find(x => x.name === name); if (c) return c.id; }
  }
  return ex[0] ? ex[0].id : null;
}
function inboxDraft(n) {
  const p = parseNotif(n), a = guessAcc(p);
  return {id: null, inboxId: n.id, type: 'exp', amount: p.amount || '', date: p.date, cat: guessCat(p.merchant || p.source),
    acc: a ? a.id : null, toAcc: null, merchant: p.merchant || (p.source === 'LINE Pay' ? 'LINE Pay' : ''), note: '', _p: p};
}
async function syncInbox(manual) {
  const a = S.auto;
  if (!a.url || !a.key) { if (manual) toast('請先完成通知自動記帳設定'); return 0; }
  try {
    const res = await fetch(`${a.url}${a.url.includes('?') ? '&' : '?'}key=${encodeURIComponent(a.key)}&after=${a.last || 1}`);
    const d = await res.json();
    if (!d.ok) throw new Error(d.error === 'bad key' ? '金鑰不正確' : (d.error || '伺服器拒絕'));
    const rows = d.rows || [];
    rows.forEach(r => S.inbox.push({id: uid(), row: r.row, app: r.app, title: r.title, text: r.text, ts: r.ts}));
    a.last = Math.max(1, Number(d.last) || 1); save();
    if (rows.length) toast(`收到 ${rows.length} 則新通知`); else if (manual) toast('沒有新的通知');
    return rows.length;
  } catch (e) { if (manual) toast('連線失敗：' + (e.message || e)); return 0; }
}

    const head = p.amount

        <div class="ico">📥</div><div class="sp">${head}</div>${p.amount ? `<b class="num exp">-${fmt(p.amount)}</b>` : ''}</button>
      <div class="t2" style="white-space:normal;margin:6px 0">${dup ? '<b class="exp">⚠ 帳本裡已有同日同金額的紀錄</b><br>' : ''}${raw}</div>
      <div class="btns" style="margin:0 0 4px">${p.amount ? `<button class="btn" style="padding:8px" data-act="inboxAdd" data-v="${n.id}">新增</button>` : ''}
        <button class="btn ghost" style="padding:8px" data-act="inboxEdit" data-v="${n.id}">修改後新增</button>
        <button class="btn ghost" style="padding:8px" data-act="inboxSkip" data-v="${n.id}">忽略</button></div></div>`;
  }).join('');
  openSheet(`<h3>匯入紀錄<button class="muted" data-act="close" aria-label="關閉">✕</button></h3>
    <div class="btns" style="margin:0 0 12px"><button class="btn ghost" data-act="syncNow">🔄 立即檢查</button>
      ${S.inbox.length > 1 ? `<button class="btn" data-act="inboxAddAll">全部新增</button>` : ''}</div>
    ${items || `<div class="empty">沒有待確認的通知${S.auto.url ? '' : '<br>請先到「設定 → 通知自動記帳設定」完成連結'}</div>`}`);
}
function addFromInbox(n) {
  const d = inboxDraft(n);
  if (!(d.amount > 0) || !d.acc) return false;
  S.records.push({id: uid(), type: 'exp', amount: d.amount, date: d.date, acc: d.acc, cat: d.cat, merchant: d.merchant, note: '', ts: Date.now()});
  S.inbox = S.inbox.filter(x => x.id !== n.id);
  return true;
}
function drawAuto() {
  openSheet(`<h3>通知自動記帳設定<button class="muted" data-act="close" aria-label="關閉">✕</button></h3>
    <p class="small muted" style="margin-top:0">手機上的 MacroDroid 把刷卡／付款通知送到你自己的 Google 試算表，這個網頁再從試算表讀進「匯入紀錄」。
      完整步驟請看 <a href="automation/" style="color:var(--accent)">設定教學</a>。</p>
    <label class="f"><span>Apps Script 網頁應用程式網址（結尾是 /exec）</span><input class="inp" id="au-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.auto.url)}" /></label>
    <label class="f"><span>金鑰（和 Apps Script 裡的 KEY 相同）</span><input class="inp" id="au-key" type="password" autocomplete="off" value="${esc(S.auto.key)}" /></label>
    <button class="btn" data-act="saveAuto">儲存並測試連線</button>
    <button class="btn ghost" style="margin-top:8px" data-act="autoReset">從第一則通知重新讀取</button>
    ${S.auto.url ? `<button class="btn danger" data-act="autoOff">停用通知自動記帳</button>` : ''}`);
}

/* ========== 匯出 / 匯入 ========== */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const T = {exp: '支出', inc: '收入', xfer: '轉帳'};
  const rows = [['日期', '類型', '金額', '分類', '帳戶', '轉入帳戶', '店家', '備註']];
  sortRecs(S.records).forEach(r => rows.push([r.date, T[r.type], r.amount, r.type === 'xfer' ? '' : cat(r.cat).name, acc(r.acc).name, r.type === 'xfer' ? acc(r.toAcc).name : '', r.merchant || '', r.note || '']));
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
}
function sampleData() {
  const ex = S.categories.filter(c => c.kind === 'exp'), inc = S.categories.find(c => c.kind === 'inc');
  const shops = {餐飲: ['便當店', '50嵐', '早餐店', '拉麵', '超商'], 交通: ['捷運', '加油站', '高鐵'], 購物: ['蝦皮', 'momo', 'UNIQLO'], 日用: ['全聯', '家樂福'], 娛樂: ['Netflix', '電影院', 'Steam'], 居家: ['電費', '水費', '管理費'], 醫療: ['診所', '藥局'], 學習: ['博客來', '線上課程'], '3C': ['PChome', '燦坤']};
  const range = {餐飲: [60, 420], 交通: [30, 1500], 購物: [200, 3200], 日用: [150, 1300], 娛樂: [150, 900], 居家: [500, 2800], 醫療: [150, 600], 學習: [300, 2000], '3C': [500, 9000]};
  const weight = ['餐飲', '餐飲', '餐飲', '餐飲', '交通', '交通', '日用', '購物', '娛樂', '居家', '醫療', '學習', '3C'];
  const now = new Date(), A = S.accounts;
  if (!A.length || !ex.length || !inc) return toast('請先保留至少一個帳戶與分類');
  let n = 0;
  for (let k = 0; k < 3; k++) {
    const first = new Date(now.getFullYear(), now.getMonth() - k, 1);
    const days = k === 0 ? now.getDate() : new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    S.records.push({id: uid(), type: 'inc', amount: 52000, date: ymd(new Date(first.getFullYear(), first.getMonth(), Math.min(5, days))), cat: inc.id, acc: (A[1] || A[0]).id, merchant: '薪資入帳', note: '', ts: Date.now() + n++});
    for (let d = 1; d <= days; d++) {
      const cnt = 1 + Math.floor(Math.random() * 3);
      for (let j = 0; j < cnt; j++) {
        const name = weight[Math.floor(Math.random() * weight.length)], c = ex.find(x => x.name === name) || ex[0];
        const [lo, hi] = range[name], s = shops[name];
        S.records.push({id: uid(), type: 'exp', amount: Math.round(lo + Math.random() * Math.random() * (hi - lo)), date: ymd(new Date(first.getFullYear(), first.getMonth(), d)),
          cat: c.id, acc: A[Math.floor(Math.random() * A.length)].id, merchant: s[Math.floor(Math.random() * s.length)], note: '', ts: Date.now() + n++});
      }
    }
  }
  if (!S.budget.total) S.budget.total = 30000;
  save(); toast(`已加入 ${n} 筆範例紀錄`); ui.tab = 'home'; render();
}

/* ========== 動作 ========== */
const A = {
  tab(el) { ui.tab = el.dataset.v; render(); window.scrollTo(0, 0); },
  month(el) { const k = Number(el.dataset.v); ui.month = k ? addMonth(ui.month, k) : today().slice(0, 7); render(); },
  ftype(el) { ui.ftype = el.dataset.v; render(); },
  allTime() { ui.allTime = !ui.allTime; render(); },
  close() { closeSheet(); },
  newRec() { if (!S.accounts.length) return toast('先建立一個帳戶，紀錄才有地方放'); D = newDraft('exp'); drawRec(); },
  newXfer() { if (S.accounts.length < 2) return toast('需要至少兩個帳戶才能轉帳'); D = newDraft('xfer'); drawRec(); },
  editRec(el) { const r = S.records.find(x => x.id === el.dataset.v); if (r) { D = {merchant: '', note: '', ...r}; drawRec(); } },
  recType(el) { syncRec(); D.type = el.dataset.v; drawRec(); },
  pickCat(el) { D.cat = el.dataset.v; el.parentNode.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b === el)); },
  saveRec() {
    syncRec();
    const amount = Math.round(Number(D.amount) * 100) / 100;
    if (!(amount > 0)) return toast('請輸入金額');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(D.date)) return toast('請選擇日期');
    if (!D.acc) return toast('請選擇帳戶');
    if (D.type === 'xfer' && D.acc === D.toAcc) return toast('轉出與轉入帳戶不能相同');
    const r = {id: D.id || uid(), type: D.type, amount, date: D.date, acc: D.acc, note: D.note.trim(), ts: D.ts || Date.now()};
    if (D.type === 'xfer') r.toAcc = D.toAcc; else { r.cat = D.cat; r.merchant = (D.merchant || '').trim(); }
    const i = S.records.findIndex(x => x.id === r.id);
    if (i >= 0) S.records[i] = r; else S.records.push(r);
    const fromInbox = D.inboxId;
    if (fromInbox) S.inbox = S.inbox.filter(x => x.id !== fromInbox);
    save(); const isNew = i < 0; closeSheet(); ui.month = r.date.slice(0, 7); render(); toast(isNew ? '已新增紀錄' : '已更新紀錄');
    if (fromInbox && S.inbox.length) drawInbox();
  },
  delRec() { if (!confirm('刪除這筆紀錄？')) return; S.records = S.records.filter(x => x.id !== D.id); save(); closeSheet(); render(); toast('已刪除紀錄'); },
  editAcc(el) { drawAcc(el.dataset.v); },
  saveAcc(el) {
    const name = $('#a-name').value.trim(), type = $('#a-type').value, bal = Number($('#a-bal').value) || 0;
    if (!name) return toast('請輸入名稱');
    const a = S.accounts.find(x => x.id === el.dataset.v);
    const last4 = $('#a-last4').value.replace(/\D/g, '').slice(0, 4);
    if (a) { a.init = (Number(a.init) || 0) + (bal - balance(a)); a.name = name; a.type = type; a.last4 = last4; }
    else S.accounts.push({id: uid(), name, type, init: bal, last4});
    save(); closeSheet(); render(); toast(a ? '已更新帳戶' : '已新增帳戶');
  },
  delAcc(el) {
    const id = el.dataset.v;
    if (S.records.some(r => r.acc === id || r.toAcc === id)) return toast('這個帳戶還有紀錄，不能刪除');
    if (!confirm('刪除這個帳戶？')) return;
    S.accounts = S.accounts.filter(a => a.id !== id); save(); closeSheet(); render(); toast('已刪除帳戶');
  },
  cats(el) { D = null; drawCats(el.dataset.v); },
  editCat(el) { drawCat(el.dataset.v, el.dataset.kind); },
  pickIcon(el) { $('#c-icon').value = el.dataset.v; },
  pickColor(el) { D.color = el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); },
  saveCat() {
    const name = $('#c-name').value.trim(), icon = $('#c-icon').value.trim() || '📦';
    if (!name) return toast('請輸入分類名稱');
    if (S.categories.some(c => c.kind === D.kind && c.name === name && c.id !== D.id)) return toast(`已經有叫「${name}」的分類了`);
    const c = S.categories.find(x => x.id === D.id);
    if (c) Object.assign(c, {name, icon, color: D.color}); else S.categories.push({id: uid(), name, icon, color: D.color, kind: D.kind});
    save(); const k = D.kind; render(); drawCats(k); toast('已儲存分類');
  },
  delCat() {
    if (S.categories.filter(c => c.kind === D.kind).length <= 1) return toast('至少要保留一個分類');
    const n = S.records.filter(r => r.cat === D.id).length;
    if (!confirm(n ? `有 ${n} 筆紀錄用了這個分類，刪除後會顯示為「未分類」。確定刪除？` : `刪除「${D.name}」？`)) return;
    S.categories = S.categories.filter(c => c.id !== D.id); delete S.budget.cats[D.id];
    save(); const k = D.kind; render(); drawCats(k); toast('已刪除分類');
  },
  inbox() { drawInbox(); },
  async syncNow() { await syncInbox(true); render(); drawInbox(); },
  inboxEdit(el) { const n = S.inbox.find(x => x.id === el.dataset.v); if (!n) return; if (!S.accounts.length) return toast('先建立一個帳戶，紀錄才有地方放'); D = inboxDraft(n); drawRec(); },
  inboxAdd(el) {
    const n = S.inbox.find(x => x.id === el.dataset.v); if (!n) return;
    if (!addFromInbox(n)) return toast('資料不完整，請用「修改後新增」');
    save(); render(); toast('已新增紀錄'); S.inbox.length ? drawInbox() : closeSheet();
  },
  inboxAddAll() {
    let k = 0; S.inbox.slice().forEach(n => { if (addFromInbox(n)) k++; });
    save(); render(); toast(`已新增 ${k} 筆紀錄${S.inbox.length ? `，${S.inbox.length} 則需手動確認` : ''}`); S.inbox.length ? drawInbox() : closeSheet();
  },
  inboxSkip(el) { S.inbox = S.inbox.filter(x => x.id !== el.dataset.v); save(); render(); toast('已忽略'); S.inbox.length ? drawInbox() : closeSheet(); },
  autoSet() { drawAuto(); },
  async saveAuto() {
    const url = $('#au-url').value.trim(), key = $('#au-key').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('網址格式不對，結尾應該是 /exec');
    if (!key) return toast('請輸入金鑰');
    S.auto.url = url; S.auto.key = key; save();
    await syncInbox(true); render(); if (S.inbox.length) drawInbox(); else closeSheet();
  },
  async autoReset() { if (!confirm('從試算表第一則通知重新讀取？已處理過的通知會再出現一次。')) return; S.auto.last = 1; save(); await syncInbox(true); render(); drawInbox(); },
  autoOff() { if (!confirm('停用通知自動記帳？（試算表裡的資料不會被刪除）')) return; S.auto = {url: '', key: '', last: 1}; save(); closeSheet(); render(); toast('已停用'); },
  budget() { drawBudget(); },
  saveBudget() {
    S.budget.total = Math.max(0, Number($('#b-total').value) || 0); S.budget.cats = {};
    document.querySelectorAll('.b-cat').forEach(i => { const v = Number(i.value) || 0; if (v > 0) S.budget.cats[i.dataset.id] = v; });
    save(); closeSheet(); render(); toast('已儲存預算');
  },
  theme() { const o = ['auto', 'light', 'dark']; S.theme = o[(o.indexOf(S.theme || 'auto') + 1) % 3]; save(); applyTheme(); render(); },
  exportJson() { download(`ledger-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast('已匯出備份'); },
  exportCsv() { download(`ledger-${today()}.csv`, toCsv(), 'text/csv;charset=utf-8'); toast('已匯出 CSV'); },
  importJson() { $('#file').click(); },
  sample() { if (confirm('加入近三個月的示範紀錄？（不會刪除現有資料）')) sampleData(); },
  wipe() {
    if (!confirm('清除全部資料？這個動作無法復原。')) return;
    if (!confirm('再確認一次：真的要清除所有紀錄、帳戶、分類與預算嗎？')) return;
    S = defaults(); save(); applyTheme(); render(); toast('已清除全部資料');
  },
};

document.addEventListener('click', e => {
  if (e.target.id === 'mask') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) A[el.dataset.act](el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#reclist').innerHTML = listHtml(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'file' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.records) || !Array.isArray(d.accounts) || !Array.isArray(d.categories)) throw 0;
      if (!confirm(`匯入 ${d.records.length} 筆紀錄並取代目前所有資料？`)) return;
      S = norm(d); save(); applyTheme(); render(); toast('已還原備份');
    } catch (err) { toast('讀取失敗：不是有效的備份檔'); }
  };
  fr.readAsText(e.target.files[0]); e.target.value = '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function render() {
  const v = {home: viewHome, list: viewList, acc: viewAcc, set: viewSet}[ui.tab];
  $('#app').innerHTML = v();
  document.querySelectorAll('nav [data-act="tab"]').forEach(b => b.classList.toggle('on', b.dataset.v === ui.tab));
}
applyTheme(); render();
const autoSync = () => syncInbox(false).then(n => { if (n && !$('#mask').classList.contains('show')) render(); });
autoSync();
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoSync(); });
</script>
